<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posture Pressure Balance</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f3f4f7;
    padding: 40px;
  }
  h1 {
    margin-bottom: 15px;
  }
  #status {
    font-size: 1.2em;
    margin-bottom: 20px;
    font-weight: bold;
  }
  .bar-container {
    position: relative;
    width: 80%;
    height: 20px;
    background: linear-gradient(to right, #ff7675, #ddd, #74b9ff);
    border-radius: 10px;
    margin: 25px auto;
  }
  .indicator {
    position: absolute;
    top: -6px;
    width: 12px;
    height: 32px;
    background: #2d3436;
    border-radius: 4px;
    left: 50%;
    transform: translateX(-50%);
    transition: left 0.2s ease;
  }
  .label {
    margin-top: 5px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>Posture Pressure Balance</h1>
<div id="status">Waiting for data...</div>

<div class="bar-container">
  <div class="indicator" id="indicator-lower"></div>
</div>
<div class="label">Lower Back</div>

<div class="bar-container">
  <div class="indicator" id="indicator-mid"></div>
</div>
<div class="label">Mid Back</div>

<div class="bar-container">
  <div class="indicator" id="indicator-upper"></div>
</div>
<div class="label">Upper Back</div>

<script>
async function updateData() {
  const res = await fetch('/data');
  const data = await res.json();

  const statusEl = document.getElementById('status');

  if (!data.sitting) {
    statusEl.textContent = "🪑 User not sitting";
  } else if (data.baseline.lower === null) {
    statusEl.textContent = `⌛ Calibrating... ${data.time.toFixed(1)}s`;
  } else {
    statusEl.textContent = "✅ Monitoring balance";

    // Move indicators: deviation -100 (left), +100 (right)
    ["lower", "mid", "upper"].forEach(id => {
      const val = data.deviation[id];
      const el = document.getElementById(`indicator-${id}`);
      const position = 50 + val / 2; // map [-100,100] → [0,100]
      el.style.left = `${position}%`;
    });
  }
}

setInterval(updateData, 300);
</script>
</body>
</html>
