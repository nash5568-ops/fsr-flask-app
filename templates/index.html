<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posture Pressure Visualization</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f3f4f7;
    padding: 40px;
  }
  h1 { margin-bottom: 10px; }
  #status {
    font-size: 1.2em;
    margin-bottom: 20px;
    font-weight: bold;
  }
  .bar-container {
    width: 80%;
    height: 40px;
    background: #ddd;
    border-radius: 10px;
    margin: 15px auto;
    position: relative;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    background: #007bff;
    width: 0%;
    transition: width 0.3s;
  }
  .label {
    position: absolute;
    width: 100%;
    top: 8px;
    font-weight: bold;
    color: #333;
  }
</style>
</head>
<body>

<h1>Posture Pressure Monitor</h1>
<div id="status">Waiting for data...</div>

<div class="bar-container">
  <div class="bar" id="bar-lower"></div>
  <div class="label">Lower Back</div>
</div>
<div class="bar-container">
  <div class="bar" id="bar-mid"></div>
  <div class="label">Mid Back</div>
</div>
<div class="bar-container">
  <div class="bar" id="bar-upper"></div>
  <div class="label">Upper Back</div>
</div>

<script>
async function updateData() {
  const res = await fetch('/data');
  const data = await res.json();

  const statusEl = document.getElementById('status');
  if (!data.sitting) {
    statusEl.textContent = "🪑 User not sitting";
    document.querySelectorAll('.bar').forEach(b => b.style.width = '0%');
  } else if (data.baseline.lower === null) {
    statusEl.textContent = "⌛ Collecting baseline... " + data.time.toFixed(1) + "s";
  } else {
    statusEl.textContent = "✅ Sitting — Live Pressure Feedback";
    document.getElementById('bar-lower').style.width = data.fill.lower + '%';
    document.getElementById('bar-mid').style.width = data.fill.mid + '%';
    document.getElementById('bar-upper').style.width = data.fill.upper + '%';
  }
}

setInterval(updateData, 300);
</script>
</body>
</html>
