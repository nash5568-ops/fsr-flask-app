<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live FSR Sensor Data</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 40px;
    }
    h1 {
      margin-bottom: 20px;
    }
    canvas {
      width: 90% !important;
      max-width: 900px;
      height: 400px !important;
      margin: auto;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Live FSR Sensor Data</h1>
  <canvas id="chart"></canvas>
  <button onclick="resetChart()">Reset Data</button>

  <script>
    const ctx = document.getElementById('chart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'FSR Value',
          data: [],
          borderColor: 'blue',
          borderWidth: 2,
          fill: false,
          tension: 0.25
        }]
      },
      options: {
        animation: false,
        responsive: true,
        scales: {
          x: { title: { display: true, text: 'Time (s)' } },
          y: { title: { display: true, text: 'FSR Value' }, beginAtZero: true }
        }
      }
    });

    async function updateData() {
      const res = await fetch('/data');
      const data = await res.json();
      chart.data.labels = data.map(d => d.time);
      chart.data.datasets[0].data = data.map(d => d.value);
      chart.update();
    }

    async function resetChart() {
      await fetch('/reset');
      chart.data.labels = [];
      chart.data.datasets[0].data = [];
      chart.update();
    }

    setInterval(updateData, 300); // update every 0.3 seconds
  </script>
</body>
</html>
